.bs-path{position:fixed;inset:0;z-index:20;display:none;overflow:auto;background:rgba(239,230,210,.78);background-image:radial-gradient(ellipse at 50% 40%,rgba(255,250,236,.7),rgba(239,230,210,0) 70%);font:16px/1.4 Georgia,'Times New Roman',serif;color:${Wp}}
.bs-path.on{display:block}
.bs-pw{max-width:1180px;margin:0 auto;padding:64px 32px 40px;box-sizing:border-box}
.bs-ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:1.5px solid rgba(27,22,17,.25);padding-bottom:14px}
.bs-pt{font-size:44px;letter-spacing:.14em;line-height:1}
.bs-ps{font-size:15px;opacity:.75;margin-top:8px}
.bs-pr{text-align:right;font-size:15px}
.bs-lives{display:inline-flex;gap:6px;vertical-align:middle;margin-left:8px}
.bs-drop{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1.5px solid ${Wp};box-sizing:border-box}
.bs-drop.in{background:${Wp}}.bs-drop.stake{background:${Gp};border-color:${Gp}}.bs-drop.gone{opacity:.3}
.bs-pmap{display:block;width:100%;height:auto;margin:18px 0 8px}
.bs-pmap .go{cursor:pointer}
.bs-pmap .go circle.ring{animation:bs-pulse 1.6s ease-in-out infinite}
@keyframes bs-pulse{50%{stroke-opacity:.35}}
.bs-pmap .go:hover circle.body,.bs-pmap .go:focus-visible circle.body{fill:rgba(166,30,24,.14)}
.bs-pmap .go{outline:none}
.bs-pmap .go:focus-visible circle.ring{stroke:${Wp};stroke-width:4;stroke-opacity:1;animation:none}
.bs-pmap text{font-family:Georgia,'Times New Roman',serif}
.bs-prow{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;flex-wrap:wrap;margin-top:6px}
.bs-pseals{flex:1;min-width:280px;font-size:14px}
.bs-pseals b{color:${Gp};font-weight:normal;letter-spacing:.04em}
.bs-pnote{font-size:16px;margin:4px 0 10px;min-height:22px}
.bs-pbtns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bs-pb{font:inherit;font-size:16px;letter-spacing:.08em;padding:9px 22px;border:1.5px solid ${Wp};background:transparent;color:${Wp};cursor:pointer;border-radius:3px}
.bs-pb:hover{background:${Wp};color:${Kp}}
.bs-pb.main{border-color:${Gp};color:${Gp}}
.bs-pb.main:hover{background:${Gp};color:${Kp}}
.bs-pb:focus{outline:none}
.bs-pb:focus-visible{outline:2px solid ${Gp};outline-offset:3px}
.bs-pb.quiet{border-color:rgba(27,22,17,.4);opacity:.8}
.bs-pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin:26px 0}
.bs-pc{border:1.5px solid rgba(27,22,17,.35);border-radius:4px;padding:20px 22px;background:rgba(255,250,236,.35);display:flex;flex-direction:column;gap:12px}
.bs-pc:focus-within{border-color:${Gp}}
.bs-pc h3{margin:0;font-weight:normal;font-size:22px;letter-spacing:.06em;color:${Gp}}
.bs-pc p{margin:0;flex:1}
.bs-pend{text-align:center;padding-top:12vh}
.bs-pend .bs-pt{font-size:60px}
.bs-pend .bs-pt.won{color:${Gp}}

.bs-front{position:fixed;inset:0;z-index:25;overflow:auto;font:17px/1.45 Georgia,'Times New Roman',serif;color:${sm};touch-action:none}
.bs-front.veil{background:rgba(239,230,210,.9)}
.bs-fw{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;box-sizing:border-box}
.bs-title{position:relative;margin:0;font-weight:400;font-size:clamp(56px,11vw,190px);letter-spacing:.16em;line-height:1;padding-left:.16em;user-select:none;-webkit-user-select:none}
.bs-title span{display:block}
.bs-title .b{position:absolute;inset:0;padding-left:.16em}
.bs-title .a{clip-path:polygon(0 0,100% 0,100% 52%,0 52%)}
.bs-title .b{clip-path:polygon(0 52%,100% 52%,100% 100%,0 100%)}
.bs-title.cut .a{transform:translate(-.08em,-.06em) rotate(-1.2deg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bs-title.cut .b{transform:translate(.08em,.05em) rotate(.8deg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bs-hint{margin-top:34px;font-size:18px;letter-spacing:.06em;opacity:.75;text-align:center}
.bs-front button{font:inherit;color:${sm};background:none;border:0;cursor:pointer}
.bs-enter{margin-top:14px;font-size:15px!important;letter-spacing:.14em;text-transform:uppercase;opacity:.6;padding:8px 14px;border-bottom:1.5px solid transparent!important}
.bs-enter:hover,.bs-enter:focus-visible{opacity:1;border-bottom-color:${cm}!important;outline:none}
.bs-trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.bs-trail polyline{fill:none;stroke:${sm};stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.bs-trail polyline.hit{stroke:${cm}}
.bs-h{font-size:clamp(34px,4.6vw,58px);letter-spacing:.16em;margin:0 0 6px;font-weight:400;text-align:center}
.bs-sub{opacity:.7;margin:0 0 26px;text-align:center;font-size:16px}
.bs-list{display:flex;flex-direction:column;gap:4px;width:min(560px,100%)}
.bs-item{display:flex!important;justify-content:space-between;align-items:baseline;gap:20px;width:100%;text-align:left;padding:12px 16px!important;border-left:2px solid transparent!important;box-sizing:border-box}
.bs-item b{font-weight:400;font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.bs-item small{font-size:15px;opacity:.7;text-align:right}
.bs-item:hover,.bs-item:focus-visible{background:rgba(27,22,17,.06);border-left-color:${cm}!important;outline:none}
.bs-item[disabled]{cursor:default;opacity:.45}
.bs-item[disabled]:hover{background:none;border-left-color:transparent!important}
.bs-text{width:min(680px,100%)}
.bs-text p,.bs-text li{margin:0 0 10px}
.bs-text ul{padding-left:20px;margin:0 0 14px}
.bs-text h3{font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:16px;margin:18px 0 8px;color:${cm}}
.bs-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid rgba(27,22,17,.18)}
.bs-row label{letter-spacing:.1em;text-transform:uppercase;font-size:16px}
.bs-row input[type=range]{width:220px;accent-color:${cm};-webkit-appearance:none;appearance:none;background:transparent;height:22px;margin:0;cursor:pointer}
.bs-row input[type=range]::-webkit-slider-runnable-track{height:3px;background:${sm};border-radius:2px}
.bs-row input[type=range]::-moz-range-track{height:3px;background:${sm};border-radius:2px}
.bs-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:${cm};border:1.5px solid ${sm};box-sizing:border-box}
.bs-row input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:${cm};border:1.5px solid ${sm};box-sizing:border-box}
.bs-row input[type=range]:focus{outline:none}
.bs-row input[type=range]:focus-visible{outline:2px solid ${cm};outline-offset:4px}
.bs-seg{display:flex;gap:4px}
.bs-seg button{padding:6px 14px!important;border:1.5px solid rgba(27,22,17,.35)!important;font-size:15px!important}
.bs-seg button.on{border-color:${cm}!important;color:${cm}}
.bs-note{font-size:15px;opacity:.75;margin-top:12px}
.bs-pad{font-size:14px;opacity:.75;margin:4px 0 8px}
.bs-back{margin-top:26px;letter-spacing:.14em;text-transform:uppercase;font-size:15px!important;padding:8px 14px!important;opacity:.75;border-bottom:1.5px solid transparent!important}
.bs-back:hover,.bs-back:focus-visible{opacity:1;border-bottom-color:${cm}!important;outline:none}
.bs-fw.bs-panel{height:100%;min-height:0}
.bs-panel>*{flex-shrink:0}
.bs-scroll{flex:0 1 auto!important;min-height:0;overflow-y:auto;overflow-x:hidden;width:min(1000px,100%);display:flex;flex-direction:column;align-items:center;padding:0 10px;box-sizing:border-box;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(27,22,17,.4) transparent}
.bs-scroll .bs-list{flex-shrink:0}
.bs-cols{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:0 56px;width:100%}
.bs-cols>.bs-text{width:min(440px,100%)}
.bs-cols .bs-row input[type=range]{width:150px}
.bs-side{display:flex;gap:18px;align-items:flex-start}
.bs-side ul{flex:1 1 auto;min-width:0}
.bs-demos{display:flex;flex-wrap:wrap;gap:8px 18px;margin:2px 0 12px}
.bs-demo{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;letter-spacing:.08em}
.bs-demo svg{display:block;width:120px;height:80px;background:rgba(27,22,17,.045);border-radius:3px}
.bs-demo .st{fill:none;stroke:${sm};stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:bs-draw 2.6s ease-in infinite}
.bs-demo .dot{fill:${sm};transform-box:fill-box;transform-origin:center;animation:bs-dot 2.6s ease-out infinite}
.bs-demo .ln{stroke:${cm};stroke-width:2;stroke-dasharray:3 4;opacity:0;animation:bs-warn 2.6s linear infinite}
.bs-demo.parry .st{animation-name:bs-draw-late}
.bs-demos.high .st,.bs-demos.high .dot{filter:drop-shadow(0 0 1.2px rgba(27,22,17,.7))}
@keyframes bs-draw{0%,12%{stroke-dashoffset:100;opacity:1}42%,74%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes bs-draw-late{0%,34%{stroke-dashoffset:100;opacity:1}56%,78%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes bs-dot{0%,20%{transform:scale(0);opacity:1}34%{transform:scale(1.5);opacity:1}46%,74%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes bs-warn{0%{opacity:0}18%,50%{opacity:.5}56%{opacity:1;stroke-dasharray:none}74%{opacity:.25}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bs-demo .st,.bs-demo .dot,.bs-demo .ln{animation:none!important;stroke-dashoffset:0;opacity:1}.bs-demo .ln{opacity:.5}}
@media (max-height:800px){
.bs-fw{padding:18px 24px}
.bs-h{margin-bottom:2px}
.bs-sub{margin-bottom:12px}
.bs-row{padding:7px 0}
.bs-item{padding:8px 16px!important}
.bs-text h3{margin:10px 0 6px}
.bs-text p,.bs-text li{margin-bottom:6px}
.bs-note{margin-top:8px}
